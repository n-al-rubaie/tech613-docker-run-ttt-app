services:
  mongo:
    # Use MongoDB 7.0 image
    image: mongo:7.0

    # Custom container name
    container_name: init-tech613-mongo

    # Restart automatically unless manually stopped
    restart: unless-stopped

    ports:
      # Map host port 27019 to container port 27017
      - "27019:27017"

    volumes:
      # Store MongoDB data persistently
      - init-mongo-data:/data/db

      # Mount MongoDB initialisation scripts as read-only
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # Check that MongoDB is responding
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]

      # Run check every 5 seconds
      interval: 5s

      # Allow 3 seconds for a response
      timeout: 3s

      # Mark unhealthy after 10 failures
      retries: 10

      # Wait 10 seconds before starting checks
      start_period: 10s

  app:
    # Application image from Docker Hub
    image: nalrubaie/tech613-tttapp:1.2.0

    # Custom container name
    container_name: init-tech613-app

    # Restart automatically unless manually stopped
    restart: unless-stopped

    ports:
      # Map host port 3002 to application port 3000
      - "3002:3000"

    environment:
      # MongoDB connection string used by the application
      MONGODB_URI: mongodb://mongo:27017/tictactoe

    depends_on:
      mongo:
        # Wait until MongoDB passes its health check
        condition: service_healthy

    healthcheck:
      # Check that the application is responding
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

      # Run check every 5 seconds
      interval: 5s

      # Allow 3 seconds for a response
      timeout: 3s

      # Mark unhealthy after 10 failures
      retries: 10

      # Wait 10 seconds before starting checks
      start_period: 10s

volumes:
  # Named volume for persistent MongoDB storage
  init-mongo-data:
